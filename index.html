<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b3cc4">
  <meta name="description" content="تطبيق الملك ماثيو للتعلم والمرح">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>الملك ماثيو 👑</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="crown">👑</span><div><strong>الملك ماثيو</strong><small>مملكة التعلم والمرح</small></div></div>
    <button id="installBtn" class="install hidden" type="button">تثبيت التطبيق</button>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy"><span class="eyebrow">أهلاً يا بطل!</span><h1>مستعد لمغامرة جديدة؟</h1><p>اتعلم، العب، واجمع النجوم في مملكتك!</p><div class="stats"><span>⭐ <b id="totalStars">0</b> نجمة</span><span>🏆 <b id="bestScore">0</b> أفضل نتيجة</span></div></div>
      <div class="king-art"><img src="./icon.svg" alt="الملك ماثيو"></div>
    </section>
    <section class="section-head"><div><span class="eyebrow">اختار مغامرتك</span><h2>ماذا نلعب اليوم؟</h2></div><button id="parentBtn" class="parent-entry" type="button">👨‍👩‍👦 لوحة ولي الأمر</button></section>
    <section class="games" id="gameList">
      <button class="game-card purple" data-category="numbers"><span class="game-icon">🔢</span><strong>تدريب حساب بالعربي</strong><small>عدّ وتعلّم بالأرقام العربية ١ ٢ ٣</small><span class="play">ابدأ التعلم ←</span></button>
      <button class="game-card blue" data-category="math"><span class="game-icon">➕</span><strong>Math practice</strong><small>Numbers, counting and simple math</small><span class="play">Let's learn ←</span></button>
      <button class="game-card orange" data-category="letters"><span class="game-icon">🔤</span><strong>حروف وكلمات</strong><small>اكتشف الحروف</small><span class="play">ابدأ التعلم ←</span></button>
      <button class="game-card green" data-category="colors"><span class="game-icon">🎨</span><strong>الألوان والأشكال</strong><small>شوف واختار الصح</small><span class="play">ابدأ التعلم ←</span></button>
      <button class="game-card blue" data-category="world"><span class="game-icon">🌍</span><strong>معلومات ممتعة</strong><small>حيوانات وأشياء حولنا</small><span class="play">ابدأ التعلم ←</span></button>
      <button class="game-card pink" data-category="mixed"><span class="game-icon">🎲</span><strong>اختبار المفاجآت</strong><small>أسئلة متنوعة من كل المواد</small><span class="play">فاجئني ←</span></button>
    </section>
    <section id="quiz" class="quiz-panel hidden" aria-live="polite">
      <div class="quiz-top"><button id="backBtn" class="back" type="button">→ رجوع</button><span id="categoryName"></span><span id="questionCount"></span></div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="question-area"><div class="question-emoji" id="questionEmoji">🌟</div><h2 id="questionText"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p></div>
      <button id="nextBtn" class="primary hidden" type="button">السؤال التالي</button>
    </section>
    <section id="result" class="result-panel hidden">
      <div class="result-crown">🏆</div><h2>أحسنت يا ملك!</h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="againBtn" class="primary" type="button">العب مرة تانية</button><button id="homeBtn" class="secondary" type="button">العودة للمملكة</button>
    </section>
    <section id="parentPanel" class="quiz-panel hidden">
      <div class="quiz-top"><button id="parentBack" class="back" type="button">→ رجوع</button><strong>لوحة متابعة ولي الأمر</strong><span>📊</span></div>
      <div id="parentSummary" class="parent-summary"></div>
    </section>
    <footer>صُنع بحب للملك ماثيو 💜 <span>يعمل دون إنترنت بعد التثبيت الأولي</span></footer>
  </main>
  <script src="./app.js" defer></script>
  <script src="./native-tts.js" defer></script>
  <script src="./voice.js" defer></script>
  <script src="./lessons.js" defer></script>
  <script src="./english-phonics.js" defer></script>
  <script src="./academy.js" defer></script>
  <script src="./math-journey.js" defer></script>
  <script src="./math-english.js" defer></script>
</body>
</html>
