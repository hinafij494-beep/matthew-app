# Rebuild trigger: latest main-branch app sources
name: Build Android APK
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/app.test.js"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "voice.js"
      - "voice-web-fallback.js"
      - "lessons.js"
      - "learning.js"
      - "math-journey.js"
      - "math-english.js"
      - "science.js"
      - "interactive-games.js"
      - "sw.js"
      - "icon.svg"
      - "manifest.webmanifest"
      - "voice-clips-pack-1.js"
      - "voice-clips-pack-2.js"
      - "voice-clips-pack-3.js"
      - "voice-clips-pack-4.js"
      - "voice-clips-pack-5.js"
      - "voice-clips-pack-6.js"
      - "voice-clips-pack-7.js"
      - "voice-clips-pack-8.js"
      - "voice-clips-pack-9.js"
      - "voice-clips-pack-10.js"
      - "voice-clips-pack-11.js"
      - "voice-clips-pack-12.js"
      - "voice-clips-pack-13.js"
      - "voice-clips-pack-14.js"
      - "voice-clips-pack-15.js"
      - "voice-clips-pack-16.js"
      - "voice-clips-text-1.js"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js voice.js voice-web-fallback.js lessons.js learning.js math-journey.js math-english.js science.js interactive-games.js sw.js icon.svg manifest.webmanifest voice-clips-pack-1.js voice-clips-pack-2.js voice-clips-pack-3.js voice-clips-pack-4.js voice-clips-pack-5.js voice-clips-pack-6.js voice-clips-pack-7.js voice-clips-pack-8.js voice-clips-pack-9.js voice-clips-pack-10.js voice-clips-pack-11.js voice-clips-pack-12.js voice-clips-pack-13.js voice-clips-pack-14.js voice-clips-pack-15.js voice-clips-pack-16.js voice-clips-text-1.js www/
      - name: Install compatible Capacitor toolchain
        run: |
          # Keep Capacitor 7 paired with Android SDK 35 and the TTS 6.x plugin.
          # Latest unpinned releases resolve to Capacitor 8 / TTS 8, which
          # require Android SDK 36 and are incompatible with this build image.
          npm install --no-save --package-lock=false \
            @capacitor/core@^7 \
            @capacitor/android@^7 \
            @capacitor/cli@^7 \
            @capacitor-community/text-to-speech@^6.1.0 \
            esbuild sharp
      - name: Validate JavaScript sources
        run: npx esbuild app.js lessons.js learning.js math-journey.js math-english.js science.js interactive-games.js voice-clips-pack-1.js voice-clips-pack-2.js voice-clips-pack-3.js voice-clips-pack-4.js voice-clips-pack-5.js voice-clips-pack-6.js voice-clips-pack-7.js voice-clips-pack-8.js voice-clips-pack-9.js voice-clips-pack-10.js voice-clips-pack-11.js voice-clips-pack-12.js voice-clips-pack-13.js voice-clips-pack-14.js voice-clips-pack-15.js voice-clips-pack-16.js voice-clips-text-1.js --outdir=/tmp/matthew-js-check --format=iife
      - name: Bundle native text-to-speech support
        run: npx esbuild voice.js --bundle --platform=browser --format=iife --outfile=www/voice.bundle.js
