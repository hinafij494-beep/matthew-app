# Rebuild trigger: latest main-branch app sources
name: Build Android APK
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "voice.js"
      - "lessons.js"
      - "learning.js"
      - "math-journey.js"
      - "math-english.js"
      - "science.js"
      - "sw.js"
      - "icon.svg"
      - "manifest.webmanifest"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js voice.js lessons.js learning.js math-journey.js math-english.js science.js sw.js icon.svg manifest.webmanifest www/
      - name: Install compatible Capacitor toolchain
        run: |
          # Keep Capacitor 7 paired with Android SDK 35 and the TTS 6.x plugin.
          # Latest unpinned releases resolve to Capacitor 8 / TTS 8, which
          # require Android SDK 36 and are incompatible with this build image.
          npm install --no-save --package-lock=false \
            @capacitor/core@^7 \
            @capacitor/android@^7 \
            @capacitor/cli@^7 \
            @capacitor-community/text-to-speech@^6.1.0 \
            esbuild sharp
      - name: Validate JavaScript sources
        run: npx esbuild app.js lessons.js learning.js math-journey.js math-english.js science.js --outdir=/tmp/matthew-js-check --format=iife
      - name: Bundle native text-to-speech support
        run: npx esbuild voice.js --bundle --platform=browser --format=iife --outfile=www/voice.bundle.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Apply Matthew launcher icon
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const root = 'android/app/src/main/res';
          const sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192};
          (async () => {
            for (const [folder,size] of Object.entries(sizes)) {
              const dir = path.join(root,folder); fs.mkdirSync(dir,{recursive:true});
              for (const name of ['ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png']) await sharp('icon.svg').resize(size,size).png().toFile(path.join(dir,name));
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-matthew-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
